[project]
name = "webonomicon"
description = "front- and back-end programming for research programmers"
version = "0.1.29"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "flask",
    "flask-cors",
    "html5validator",
    "httpx",
    "jinja2",
    "loguru",
    "markdown",
    "mccole",
    "polars",
    "prettytable",
    "pyjwt",
    "pypika",
    "pytest",
    "python-fasthtml",
    "python-multipart",
    "ruff",
    "selenium",
    "snailz",
    "structlog",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
bib = {cmd = "mccole bib", help = "Check bibliography entries."}
clean = {cmd = "find . -type f -name '*~' -exec rm {} \\; && find . -type d -name __pycache__ | xargs rm -rf && find . -type d -name .ruff_cache | xargs rm -rf", help = "Clean up generated and cache files."}
check = {cmd = "mccole check --src . --dst docs && typos *.md */*.md", help = "Check code and project."}
serve = {cmd = "python -m http.server -d docs 8000", help = "Serve generated HTML on port 8000."}
site = {cmd = "mccole build --src . --dst docs && touch docs/.nojekyll", help = "Build HTML."}

[tool.ruff.lint.extend-per-file-ignores]
"**/test_*.py" = ["F401", "F811"] # ignore complaints about unused imports for fixtures

[tool.mccole]
skips = [
    "*~",
    "99_cert/CA.*",
    "99_cert/server.*",
    "*_*/*.js",
    "*.csv",
    "*.html",
    "*.json",
    "*.mk",
    "*.py",
    "*.sh",
    "*.sql",
    "*.tbl",
    "*.text",
    "*.txt",
    "extras/**",
    "unused/**",
    "uv.lock"
]
